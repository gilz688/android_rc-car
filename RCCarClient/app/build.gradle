plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.github.gilz688.rccarclient'
    compileSdk 34

    defaultConfig {
        applicationId "com.github.gilz688.rccarclient"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "1.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildFeatures {
            viewBinding true
            buildConfig true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])

    implementation libs.androidx.multidex
    implementation libs.rxjava

    implementation libs.bugstick

    // dagger
    implementation libs.dagger
    annotationProcessor libs.dagger.compiler

    implementation libs.lifecycle.common.java8
    implementation libs.lifecycle.reactivestreams
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.cardview
    implementation libs.androidx.legacy.support.v4
    implementation libs.gson

    implementation libs.material
    implementation libs.scarlet
    implementation libs.scarlet.websocket.okhttp
    implementation libs.scarlet.lifecycle.android
    implementation libs.scarlet.message.adapter.moshi
    implementation libs.scarlet.message.adapter.protobuf
    implementation libs.scarlet.stream.adapter.rxjava2

    implementation libs.lottie

    testImplementation libs.junit
    testImplementation libs.mockito.core

    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.espresso.core
}
