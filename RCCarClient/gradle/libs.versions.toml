[versions]
agp = "8.7.3"
multidex = "2.0.1"
rxjava = "3.1.8"
bugstick = "v0.2.2"
dagger = "2.51.1"
lifecycle = "2.8.7"
appcompat = "1.7.0"
recyclerview = "1.3.2"
constraintlayout = "2.2.0"
cardview = "1.0.0"
legacySupportV4 = "1.0.0"
gson = "2.11.0"
material = "1.12.0"
scarlet = "0.1.12"
lottie = "6.4.1"
junit = "4.13.2"
mockito = "4.11.0"
androidxTestExtJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
androidx-multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }
rxjava = { module = "io.reactivex.rxjava3:rxjava", version.ref = "rxjava" }
bugstick = { module = "com.github.justasm:Bugstick", version.ref = "bugstick" }
dagger = { module = "com.google.dagger:dagger", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
lifecycle-common-java8 = { module = "androidx.lifecycle:lifecycle-common-java8", version.ref = "lifecycle" }
lifecycle-reactivestreams = { module = "androidx.lifecycle:lifecycle-reactivestreams", version.ref = "lifecycle" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-cardview = { module = "androidx.cardview:cardview", version.ref = "cardview" }
androidx-legacy-support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacySupportV4" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
material = { module = "com.google.android.material:material", version.ref = "material" }
scarlet = { module = "com.tinder.scarlet:scarlet", version.ref = "scarlet" }
scarlet-websocket-okhttp = { module = "com.tinder.scarlet:websocket-okhttp", version.ref = "scarlet" }
scarlet-lifecycle-android = { module = "com.tinder.scarlet:lifecycle-android", version.ref = "scarlet" }
scarlet-message-adapter-moshi = { module = "com.tinder.scarlet:message-adapter-moshi", version.ref = "scarlet" }
scarlet-message-adapter-protobuf = { module = "com.tinder.scarlet:message-adapter-protobuf", version.ref = "scarlet" }
scarlet-stream-adapter-rxjava2 = { module = "com.tinder.scarlet:stream-adapter-rxjava2", version.ref = "scarlet" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
junit = { module = "junit:junit", version.ref = "junit" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
